<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チャットルーム</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#eee}button,select{cursor:pointer;border:1px solid #ccc;background:#fff;border-radius:6px;padding:8px 10px}button:disabled{opacity:.55;cursor:wait}.login{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:10}.login.hidden{display:none}.login>div{background:#fff;padding:30px;border-radius:10px;text-align:center}.login input{padding:10px;width:260px;margin:15px 0}.app{height:100%;display:flex;flex-direction:column;background:#fff}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:#f7f7f7;border-bottom:1px solid #ddd}.header h1{margin:0;font-size:21px}.online{font-size:13px;flex:1}.users{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.user{display:inline-flex;gap:5px;align-items:center;background:#f0f0f0;border:1px solid #ddd;border-radius:999px;padding:2px 6px;font-size:12px}.user button{font-size:11px;padding:3px 6px}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.controls input{width:105px;padding:7px;border:1px solid #ccc;border-radius:5px}.messages{flex:1;overflow:auto;padding:20px}.message{display:flex;gap:12px;margin-bottom:15px}.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:#999}.body{min-width:0}.name{font-weight:bold}.text{white-space:pre-wrap;word-break:break-word}.time{font-size:12px;color:#888}.input{display:flex;gap:8px;padding:12px 18px;border-top:1px solid #ddd}.input textarea{flex:1;height:42px;resize:vertical;padding:10px;font:inherit;border:1px solid #ccc;border-radius:6px}.permission{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:none;z-index:20;background:#222;color:#fff;padding:10px 15px;border-radius:8px}.permission.show{display:block}.call{display:none;position:fixed;right:15px;bottom:15px;width:400px;z-index:15;background:#fff;border:1px solid #bbb;border-radius:10px;padding:10px;box-shadow:0 5px 20px #0003}.call.show{display:block}.title{text-align:center;font-weight:bold;margin-bottom:8px}.videos{display:flex;gap:8px}.videos video{width:calc(50% - 4px);height:140px;background:#111;object-fit:cover;border-radius:6px}.camera{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px}.camera select{flex:1;padding:6px}.actions{display:flex;justify-content:center;gap:7px;margin-top:8px}@media(max-width:700px){.header{flex-wrap:wrap}.controls{width:100%}.call{left:10px;right:10px;width:auto}.videos video{height:110px}}
</style>
</head>
<body>
<div class="login" id="login"><div><h2>ログインしてください</h2><input id="loginName" placeholder="名前を入力"><br><button id="loginBtn">ログイン</button></div></div>
<div class="permission" id="permission"></div>
<div class="app"><header class="header"><h1>チャットルーム</h1><div class="online"><div id="onlineText">🔴 オフライン</div><div id="users" class="users"></div></div><div class="controls"><input id="name" readonly><button id="rename">名前変更</button><button id="mic">🎤OFF</button><button id="cam">📷OFF</button></div></header><main id="messages" class="messages"></main><footer class="input"><textarea id="messageInput" placeholder="メッセージ入力"></textarea><button id="send">送信</button></footer></div>
<div id="call" class="call"><div class="title">通話中: <span id="callName"></span></div><div class="videos"><video id="local" autoplay muted playsinline></video><video id="remote" autoplay playsinline></video></div><div class="camera">カメラ:<select id="cameraSelect"></select></div><div class="actions"><button id="mute">ミュート</button><button id="cameraButton">カメラ停止</button><button id="hangup">切断</button></div></div>
<script>
const URL='https://bttpvmqzyocukemozajz.supabase.co',KEY='sb_publishable_sk8Jur900Z7CIhNWJb9UuQ_uW8nm7vI',HEAD={apikey:KEY,Authorization:`Bearer ${KEY}`},RTC={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
let user=localStorage.getItem('chat_username')||'',pc=null,localStream=null,target=null,micOn=false,camOn=false,cameraId='',polling=false,prompting=false,jobs=false,messageBusy=false,messageTimer=null;
const $=id=>document.getElementById(id);const api=(p,o={})=>fetch(URL+p,{...o,headers:{...(o.headers||{}),...HEAD}});const headers=()=>({'Content-Type':'application/json',...HEAD});
function notice(s){$('permission').textContent=s;$('permission').classList.add('show')}function noticeOff(){setTimeout(()=>$('permission').classList.remove('show'),500)}
async function media(kind){notice(kind==='camera'?'カメラの許可を求めています。ブラウザで「許可」を押してください。':'マイクの許可を求めています。ブラウザで「許可」を押してください。');try{const c=kind==='camera'?(cameraId?{video:{deviceId:{exact:cameraId}}}:{video:true}):{audio:true};const s=await navigator.mediaDevices.getUserMedia(c);noticeOff();return s}catch(e){noticeOff();alert(`${kind==='camera'?'カメラ':'マイク'}の許可が必要です。\n${e.message}`);return null}}
async function cameras(){try{const r=await navigator.mediaDevices.enumerateDevices(),a=r.filter(x=>x.kind==='videoinput'),s=$('cameraSelect');s.innerHTML='';a.forEach((x,i)=>s.add(new Option(x.label||`カメラ ${i+1}`,x.deviceId)));if(a.length&&!a.some(x=>x.deviceId===cameraId))cameraId=a[0].deviceId;s.value=cameraId}catch(e){console.error(e)}}
function renderMessage(m){const d=document.createElement('div');d.className='message';d.dataset.id=m.id;d.innerHTML='<div class="avatar"></div><div class="body"><div class="name"></div><div class="text"></div><div class="time"></div></div>';d.querySelector('.avatar').style.background=m.avatar_color||'#999';d.querySelector('.name').textContent=m.username;d.querySelector('.text').textContent=m.text||'';d.querySelector('.time').textContent=new Date(m.timestamp).toLocaleString();return d}
let messageRequest=null;async function loadMessages(){if(messageRequest)return messageRequest;messageRequest=(async()=>{try{const r=await api('/rest/v1/messages?order=timestamp.asc');if(!r.ok)return;const list=await r.json(),box=$('messages'),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;const old=new Map([...box.children].map(x=>[String(x.dataset.id),x]));for(const m of list){if(!old.has(String(m.id)))box.append(renderMessage(m))}for(const el of [...box.children])if(!list.some(m=>String(m.id)===String(el.dataset.id)))el.remove();if(atBottom)box.scrollTop=box.scrollHeight}catch(e){console.error('messages',e)}finally{messageRequest=null}})();return messageRequest}
async function sendMessage(){if(messageBusy)return;const input=$('messageInput'),text=input.value.trim();if(!text)return;messageBusy=true;const b=$('send');b.disabled=true;b.textContent='送信中…';try{const r=await api('/rest/v1/messages',{method:'POST',headers:headers(),body:JSON.stringify({username:user,text,avatar_color:'#999',avatar_image:null,media:[],timestamp:Date.now()})});if(!r.ok){alert('送信に失敗しました');return}input.value='';await loadMessages()}catch(e){console.error(e);alert('送信に失敗しました')}finally{messageBusy=false;b.disabled=false;b.textContent='送信'}}
async function online(){if(!user)return;try{await api(`/rest/v1/online_users?username=eq.${encodeURIComponent(user)}`,{method:'DELETE'});await api('/rest/v1/online_users',{method:'POST',headers:headers(),body:JSON.stringify({username:user})});const r=await api('/rest/v1/online_users?select=username'),us=await r.json();$('onlineText').textContent=`🟢 ${us.length}人がオンライン`;$('users').replaceChildren(...us.map(x=>{const d=document.createElement('div');d.className='user';d.append(document.createTextNode(x.username));if(x.username!==user){const b=document.createElement('button');b.textContent='通話';b.onclick=()=>callUser(x.username);d.append(b)}return d}))}catch(e){console.error('online',e)}}
async function signal(x){const r=await api('/rest/v1/webrtc_signaling',{method:'POST',headers:headers(),body:JSON.stringify(x)});if(!r.ok)console.error(await r.text())}
function peer(){if(pc)return pc;pc=new RTCPeerConnection(RTC);pc.onicecandidate=e=>e.candidate&&target&&signal({from_username:user,to_username:target,type:'candidate',candidate:e.candidate.toJSON()});pc.ontrack=e=>{if(e.streams[0]){$('remote').srcObject=e.streams[0];$('remote').play().catch(()=>{})}};pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))end(false)};return pc}
async function getLocal(){const a=await media('microphone');if(!a)return null;let v=null;if(camOn){v=await media('camera');if(!v)return null}localStream=new MediaStream([...a.getAudioTracks(),...(v?v.getVideoTracks():[])]);$('local').srcObject=localStream;return localStream}
async function callUser(to){if(pc)return alert('すでに通話中です');target=to;micOn=camOn=true;buttons();await cameras();const s=await getLocal();if(!s)return end(false);const p=peer();s.getTracks().forEach(t=>p.addTrack(t,s));const offer=await p.createOffer();await p.setLocalDescription(offer);await signal({from_username:user,to_username:to,type:'offer',sdp:p.localDescription.sdp});$('callName').textContent=to;$('call').classList.add('show')}
async function offer(m){if(pc||prompting)return;prompting=true;try{if(!confirm(`${m.from_username} から通話が来ています。受けますか？`))return;target=m.from_username;micOn=camOn=true;buttons();await cameras();const s=await getLocal();if(!s)return end(false);const p=peer();s.getTracks().forEach(t=>p.addTrack(t,s));await p.setRemoteDescription({type:'offer',sdp:m.sdp});const a=await p.createAnswer();await p.setLocalDescription(a);await signal({from_username:user,to_username:target,type:'answer',sdp:p.localDescription.sdp});$('callName').textContent=target;$('call').classList.add('show')}finally{prompting=false}}
async function poll(){if(!user||polling||prompting)return;polling=true;try{const r=await api(`/rest/v1/webrtc_signaling?to_username=eq.${encodeURIComponent(user)}&order=created_at.asc`);if(!r.ok)return;for(const m of await r.json()){try{if(m.type==='offer')await offer(m);else if(m.type==='answer'&&pc)await pc.setRemoteDescription({type:'answer',sdp:m.sdp});else if(m.type==='candidate'){if(pc?.remoteDescription)await pc.addIceCandidate(new RTCIceCandidate(m.candidate));}else if(m.type==='hangup')end(false)}finally{await api(`/rest/v1/webrtc_signaling?id=eq.${m.id}`,{method:'DELETE'})}}}catch(e){console.error('poll',e)}finally{polling=false}}
function buttons(){$('mic').textContent=micOn?'🎤ON':'🎤OFF';$('cam').textContent=camOn?'📷ON':'📷OFF';$('mute').textContent=micOn?'ミュート':'ミュート解除';$('cameraButton').textContent=camOn?'カメラ停止':'カメラ開始'}
function end(send=true){if(send&&target)signal({from_username:user,to_username:target,type:'hangup'});pc?.close();pc=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;$('local').srcObject=null;$('remote').srcObject=null;$('call').classList.remove('show');target=null;micOn=camOn=false;buttons()}
async function toggleMic(){if(!micOn){const s=await media('microphone');if(!s)return;if(!localStream)localStream=new MediaStream();const t=s.getAudioTracks()[0],sender=pc?.getSenders().find(x=>x.track?.kind==='audio');if(sender)await sender.replaceTrack(t);else if(pc)pc.addTrack(t,localStream);localStream.addTrack(t)}else localStream?.getAudioTracks().forEach(t=>t.enabled=false);micOn=!micOn;if(micOn)localStream?.getAudioTracks().forEach(t=>t.enabled=true);buttons()}
async function toggleCam(){if(!camOn){const s=await media('camera');if(!s)return;if(!localStream)localStream=new MediaStream();const t=s.getVideoTracks()[0],sender=pc?.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(t);else if(pc)pc.addTrack(t,localStream);localStream.addTrack(t);$('local').srcObject=localStream;camOn=true}else{camOn=false;localStream?.getVideoTracks().forEach(t=>t.enabled=false)}buttons()}
async function switchCamera(){cameraId=$('cameraSelect').value;if(!camOn||!pc)return;const s=await media('camera');if(!s)return;const t=s.getVideoTracks()[0],sender=pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(t);localStream.getVideoTracks().forEach(x=>x.stop());localStream.addTrack(t);$('local').srcObject=localStream}
function login(){const n=$('loginName').value.trim();if(!n)return alert('名前を入力してください');user=n;localStorage.setItem('chat_username',n);$('name').value=n;$('login').classList.add('hidden');begin()}
function begin(){if(jobs)return;jobs=true;loadMessages();online();cameras();messageTimer=setInterval(loadMessages,10000);setInterval(online,10000);setInterval(poll,2000)}
$('loginBtn').onclick=login;$('loginName').onkeydown=e=>e.key==='Enter'&&login();$('send').onclick=sendMessage;$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('mic').onclick=toggleMic;$('cam').onclick=toggleCam;$('mute').onclick=toggleMic;$('cameraButton').onclick=toggleCam;$('hangup').onclick=()=>end();$('cameraSelect').onchange=switchCamera;$('rename').onclick=()=>{const n=prompt('新しい名前',user)?.trim();if(n){user=n;localStorage.setItem('chat_username',n);$('name').value=n;online()}};
if(user){$('name').value=user;$('login').classList.add('hidden');begin()}
</script></body></html>

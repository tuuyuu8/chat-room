<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>チャットルーム</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #eee;
    }
    body { display: flex; }
    button {
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      padding: 8px 12px;
    }
    button:hover { background: #f5f5f5; }
    .login-screen {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: grid; place-items: center; z-index: 1000;
    }
    .login-screen.hidden { display: none; }
    .login-dialog {
      background: white; border-radius: 10px; padding: 30px 28px;
      text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .login-dialog h2 { margin-bottom: 16px; }
    .login-dialog input {
      width: 260px; padding: 10px 12px; margin-bottom: 16px;
      border: 1px solid #ccc; border-radius: 5px;
      font-size: 14px;
    }
    .chat-shell {
      width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff;
    }
    .chat-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; background: #f7f7f7; border-bottom: 1px solid #ddd;
    }
    .chat-header h1 { margin: 0; font-size: 22px; }
    .online-box {
      display: flex; flex-direction: column; gap: 4px; min-width: 180px;
      font-size: 13px; color: #333;
    }
    .online-row { display: flex; align-items: center; gap: 6px; }
    .user-list {
      display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px;
    }
    .user-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 6px; border-radius: 999px; background: #f0f0f0;
      border: 1px solid #ddd;
    }
    .user-pill button {
      font-size: 11px; padding: 3px 6px; margin-left: 4px;
    }
    .header-controls {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .header-controls input {
      width: 110px; padding: 7px 10px; border: 1px solid #ccc; border-radius: 5px;
      font-size: 13px;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 20px;
      background: white;
    }
    .message-row {
      display: flex; gap: 12px; margin-bottom: 14px;
    }
    .message-avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: #999; background-size: cover; background-position: center;
    }
    .message-body { flex: 1; min-width: 0; }
    .message-user { font-weight: 700; margin-bottom: 4px; }
    .message-text {
      line-height: 1.5; color: #333; white-space: pre-wrap; word-break: break-word;
    }
    .message-time { font-size: 12px; color: #888; margin-top: 4px; }
    .composer {
      display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid #ddd;
      background: #fafafa;
    }
    .composer textarea {
      flex: 1; min-height: 42px; max-height: 120px; resize: vertical;
      border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px;
      font: inherit;
    }
    .call-panel {
      position: fixed; right: 18px; bottom: 18px; width: 390px;
      display: none; z-index: 30; background: white; border: 1px solid #ccc;
      border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      padding: 10px;
    }
    .call-panel.show { display: block; }
    .call-title {
      text-align: center; font-weight: 700; margin-bottom: 8px;
    }
    .video-grid {
      display: flex; gap: 8px;
    }
    .video-grid video {
      width: calc(50% - 4px); height: 140px; background: #111; object-fit: cover;
      border-radius: 6px; cursor: pointer;
    }
    .call-actions {
      display: flex; justify-content: center; gap: 8px; margin-top: 10px;
    }
    .fullscreen-video {
      position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important;
      z-index: 9999 !important; object-fit: contain !important; border-radius: 0 !important;
      background: #000 !important;
    }
    @media (max-width: 700px) {
      .chat-header { flex-wrap: wrap; }
      .call-panel { left: 12px; right: 12px; width: auto; }
      .video-grid video { height: 110px; }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-dialog">
      <h2>ログインしてください</h2>
      <input id="usernameInput" placeholder="名前を入力" />
      <div><button id="loginBtn">ログイン</button></div>
    </div>
  </div>

  <div class="chat-shell">
    <div class="chat-header">
      <h1>チャットルーム</h1>
      <div class="online-box">
        <div class="online-row"><span id="onlineDot">🔴</span><span id="onlineText">オフライン</span></div>
        <div id="userList" class="user-list"></div>
      </div>
      <div class="header-controls">
        <input id="usernameDisplay" readonly />
        <button id="renameBtn">名前変更</button>
        <button id="micBtn">🎤OFF</button>
        <button id="camBtn">📷OFF</button>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div class="composer">
      <textarea id="messageInput" placeholder="メッセージ入力"></textarea>
      <button id="sendBtn">送信</button>
    </div>
  </div>

  <div id="callPanel" class="call-panel">
    <div class="call-title">通話中: <span id="callName"></span></div>
    <div class="video-grid">
      <video id="localVideo" autoplay muted playsinline></video>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div class="call-actions">
      <button id="muteBtn">ミュート</button>
      <button id="cameraBtn">カメラ停止</button>
      <button id="hangupBtn">切断</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bttpvmqzyocukemozajz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sk8Jur900Z7CIhNWJb9UuQ_uW8nm7vI';
    const AUTH_HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    };

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let currentUser = localStorage.getItem('chat_username') || '';
    let peerConnection = null;
    let localStream = null;
    let activeCallUser = null;
    let micEnabled = false;
    let camEnabled = false;
    let queuedCandidates = [];

    const $ = (id) => document.getElementById(id);

    function api(path, options = {}) {
      const headers = { ...(options.headers || {}), ...AUTH_HEADERS };
      return fetch(`${SUPABASE_URL}${path}`, { ...options, headers });
    }

    function setOnlineUsers(users) {
      const list = $('userList');
      list.innerHTML = '';
      users.forEach((u) => {
        const pill = document.createElement('div');
        pill.className = 'user-pill';
        const label = document.createElement('span');
        label.textContent = u.username;
        pill.appendChild(label);
        if (u.username !== currentUser) {
          const btn = document.createElement('button');
          btn.textContent = '通話';
          btn.onclick = () => startCall(u.username);
          pill.appendChild(btn);
        }
        list.appendChild(pill);
      });
    }

    async function updateOnlineStatus() {
      if (!currentUser) return;
      try {
        await api(`/rest/v1/online_users?username=eq.${encodeURIComponent(currentUser)}`, { method: 'DELETE' });
        await api('/rest/v1/online_users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...AUTH_HEADERS },
          body: JSON.stringify({ username: currentUser })
        });
        const res = await api('/rest/v1/online_users?select=username');
        const users = await res.json();
        const count = Array.isArray(users) ? users.length : 0;
        $('onlineText').textContent = count > 0 ? `${count}人がオンライン` : 'オフライン';
        $('onlineDot').textContent = count > 0 ? '🟢' : '🔴';
        setOnlineUsers(users || []);
      } catch (e) {
        console.error('updateOnlineStatus error:', e);
      }
    }

    function showMessage(message) {
      const item = document.createElement('div');
      item.className = 'message-row';
      item.dataset.id = message.id;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      if (message.avatar_image) {
        avatar.style.backgroundImage = `url('${message.avatar_image}')`;
      } else {
        avatar.style.backgroundColor = message.avatar_color || '#999';
      }

      const body = document.createElement('div');
      body.className = 'message-body';
      const user = document.createElement('div');
      user.className = 'message-user';
      user.textContent = message.username;
      const text = document.createElement('div');
      text.className = 'message-text';
      text.textContent = message.text || '';
      const time = document.createElement('div');
      time.className = 'message-time';
      const d = new Date(message.timestamp);
      time.textContent = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

      body.appendChild(user);
      body.appendChild(text);
      body.appendChild(time);
      item.appendChild(avatar);
      item.appendChild(body);
      $('messages').appendChild(item);
      $('messages').scrollTop = $('messages').scrollHeight;
    }

    async function loadMessages() {
      try {
        const res = await api('/rest/v1/messages?order=timestamp.asc');
        if (!res.ok) return;
        const messages = await res.json();
        $('messages').innerHTML = '';
        messages.forEach(showMessage);
      } catch (e) {
        console.error('loadMessages error:', e);
      }
    }

    async function sendMessage() {
      const text = $('messageInput').value.trim();
      if (!text) return;
      try {
        await api('/rest/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...AUTH_HEADERS },
          body: JSON.stringify({
            username: currentUser,
            text,
            avatar_color: '#999',
            avatar_image: null,
            media: [],
            timestamp: Date.now()
          })
        });
        $('messageInput').value = '';
        await loadMessages();
      } catch (e) {
        console.error('sendMessage error:', e);
        alert('送信に失敗しました');
      }
    }

    function login() {
      const name = $('usernameInput').value.trim();
      if (!name) {
        alert('名前を入力してください');
        return;
      }
      currentUser = name;
      localStorage.setItem('chat_username', name);
      $('usernameDisplay').value = name;
      $('loginScreen').classList.add('hidden');
      loadMessages();
      updateOnlineStatus();
      setInterval(updateOnlineStatus, 5000);
      setInterval(loadMessages, 3000);
    }

    function ensurePeerConnection() {
      if (peerConnection) return peerConnection;
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.onicecandidate = (event) => {
        if (!event.candidate || !activeCallUser) return;
        signal({
          from_username: currentUser,
          to_username: activeCallUser,
          type: 'candidate',
          candidate: event.candidate.toJSON()
        });
      };

      peerConnection.ontrack = (event) => {
        const [remoteStream] = event.streams;
        if (!remoteStream) return;
        $('remoteVideo').srcObject = remoteStream;
        $('remoteVideo').play().catch(() => {});
      };

      peerConnection.onconnectionstatechange = () => {
        if (['failed', 'closed', 'disconnected'].includes(peerConnection.connectionState)) {
          endCall(false);
        }
      };

      return peerConnection;
    }

    async function getLocalMedia() {
      if (localStream) {
        localStream.getTracks().forEach((track) => track.stop());
      }
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: camEnabled
      });
      $('localVideo').srcObject = localStream;
      $('localVideo').play().catch(() => {});
      return localStream;
    }

    async function startCall(targetUser) {
      activeCallUser = targetUser;
      micEnabled = true;
      camEnabled = true;
      $('micBtn').textContent = '🎤ON';
      $('camBtn').textContent = '📷ON';
      $('cameraBtn').textContent = 'カメラ停止';
      $('callName').textContent = targetUser;

      const stream = await getLocalMedia();
      const pc = ensurePeerConnection();
      stream.getTracks().forEach((track) => pc.addTrack(track, stream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await signal({
        from_username: currentUser,
        to_username: targetUser,
        type: 'offer',
        sdp: pc.localDescription.sdp
      });

      $('callPanel').classList.add('show');
    }

    async function handleIncomingOffer(message) {
      if (peerConnection) return;
      activeCallUser = message.from_username;
      micEnabled = true;
      camEnabled = true;
      $('micBtn').textContent = '🎤ON';
      $('camBtn').textContent = '📷ON';
      $('cameraBtn').textContent = 'カメラ停止';
      $('callName').textContent = activeCallUser;

      const stream = await getLocalMedia();
      const pc = ensurePeerConnection();
      stream.getTracks().forEach((track) => pc.addTrack(track, stream));
      await pc.setRemoteDescription({ type: 'offer', sdp: message.sdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await signal({
        from_username: currentUser,
        to_username: activeCallUser,
        type: 'answer',
        sdp: pc.localDescription.sdp
      });
      $('callPanel').classList.add('show');
    }

    async function handleIncomingAnswer(message) {
      if (!peerConnection) return;
      await peerConnection.setRemoteDescription({ type: 'answer', sdp: message.sdp });
      $('callPanel').classList.add('show');
    }

    async function handleIncomingCandidate(message) {
      if (!peerConnection) {
        queuedCandidates.push(message.candidate);
        return;
      }
      if (peerConnection.remoteDescription) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
      } else {
        queuedCandidates.push(message.candidate);
      }
    }

    async function signal(payload) {
      try {
        await api('/rest/v1/webrtc_signaling', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...AUTH_HEADERS },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error('signal error:', e);
      }
    }

    async function pollSignals() {
      if (!currentUser) return;
      try {
        const res = await api(`/rest/v1/webrtc_signaling?to_username=eq.${encodeURIComponent(currentUser)}&order=created_at.asc`);
        if (!res.ok) return;
        const rows = await res.json();
        for (const row of rows) {
          if (row.type === 'offer') {
            const ok = confirm(`${row.from_username} から通話が来ています。受けますか？`);
            if (!ok) {
              await api(`/rest/v1/webrtc_signaling?id=eq.${row.id}`, { method: 'DELETE' });
              continue;
            }
            await handleIncomingOffer(row);
          } else if (row.type === 'answer') {
            await handleIncomingAnswer(row);
          } else if (row.type === 'candidate') {
            await handleIncomingCandidate(row);
          } else if (row.type === 'hangup') {
            endCall(false);
          }
          await api(`/rest/v1/webrtc_signaling?id=eq.${row.id}`, { method: 'DELETE' });
        }
      } catch (e) {
        console.error('pollSignals error:', e);
      }
    }

    function endCall(sendHangup = true) {
      if (sendHangup && activeCallUser) {
        signal({ from_username: currentUser, to_username: activeCallUser, type: 'hangup' });
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach((track) => track.stop());
        localStream = null;
      }
      $('localVideo').srcObject = null;
      $('remoteVideo').srcObject = null;
      $('callPanel').classList.remove('show');
      activeCallUser = null;
      queuedCandidates = [];
    }

    function toggleMic() {
      micEnabled = !micEnabled;
      $('micBtn').textContent = micEnabled ? '🎤ON' : '🎤OFF';
      if (localStream) {
        localStream.getAudioTracks().forEach((track) => { track.enabled = micEnabled; });
      }
    }

    function toggleCam() {
      camEnabled = !camEnabled;
      $('camBtn').textContent = camEnabled ? '📷ON' : '📷OFF';
      $('cameraBtn').textContent = camEnabled ? 'カメラ停止' : 'カメラ開始';
      if (!localStream) return;
      localStream.getVideoTracks().forEach((track) => { track.enabled = camEnabled; });
      if (!camEnabled) {
        $('localVideo').style.display = 'none';
      } else {
        $('localVideo').style.display = 'block';
      }
    }

    function toggleFullscreen(videoEl) {
      if (videoEl.classList.contains('fullscreen-video')) {
        videoEl.classList.remove('fullscreen-video');
        if (document.fullscreenElement) document.exitFullscreen?.();
      } else {
        videoEl.classList.add('fullscreen-video');
        videoEl.requestFullscreen?.().catch(() => {});
      }
    }

    $('loginBtn').addEventListener('click', login);
    $('usernameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
    $('sendBtn').addEventListener('click', sendMessage);
    $('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    $('renameBtn').addEventListener('click', () => {
      const name = prompt('新しい名前', currentUser)?.trim();
      if (!name) return;
      currentUser = name;
      localStorage.setItem('chat_username', name);
      $('usernameDisplay').value = name;
      updateOnlineStatus();
    });
    $('micBtn').addEventListener('click', toggleMic);
    $('camBtn').addEventListener('click', async () => {
      camEnabled = !camEnabled;
      $('camBtn').textContent = camEnabled ? '📷ON' : '📷OFF';
      $('cameraBtn').textContent = camEnabled ? 'カメラ停止' : 'カメラ開始';

      if (!peerConnection) {
        if (camEnabled) {
          const stream = await getLocalMedia();
          const pc = ensurePeerConnection();
          stream.getTracks().forEach((track) => pc.addTrack(track, stream));
        }
        return;
      }

      const videoSender = peerConnection.getSenders().find((s) => s.track && s.track.kind === 'video');
      if (!videoSender) {
        const stream = await getLocalMedia();
        stream.getVideoTracks().forEach((track) => peerConnection.addTrack(track, stream));
        return;
      }

      if (camEnabled) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const track = stream.getVideoTracks()[0];
        await videoSender.replaceTrack(track);
        localStream.getVideoTracks().forEach((t) => t.stop());
        localStream = stream;
        $('localVideo').srcObject = localStream;
      } else {
        videoSender.replaceTrack(null);
      }
    });
    $('muteBtn').addEventListener('click', toggleMic);
    $('cameraBtn').addEventListener('click', async () => {
      camEnabled = !camEnabled;
      $('camBtn').textContent = camEnabled ? '📷ON' : '📷OFF';
      $('cameraBtn').textContent = camEnabled ? 'カメラ停止' : 'カメラ開始';
      if (!localStream) return;
      localStream.getVideoTracks().forEach((track) => { track.enabled = camEnabled; });
    });
    $('hangupBtn').addEventListener('click', () => endCall(true));
    $('localVideo').addEventListener('click', () => toggleFullscreen($('localVideo')));
    $('remoteVideo').addEventListener('click', () => toggleFullscreen($('remoteVideo')));
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        $('localVideo').classList.remove('fullscreen-video');
        $('remoteVideo').classList.remove('fullscreen-video');
      }
    });

    if (currentUser) {
      $('usernameDisplay').value = currentUser;
      $('loginScreen').classList.add('hidden');
      loadMessages();
      updateOnlineStatus();
      setInterval(updateOnlineStatus, 5000);
      setInterval(loadMessages, 3000);
    }
    setInterval(pollSignals, 700);
  </script>
</body>
</html>

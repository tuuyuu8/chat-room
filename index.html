<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャットルーム</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#f2f2f2}button{cursor:pointer;border:1px solid #ccc;background:#fff;border-radius:5px;padding:7px 10px}button:hover{background:#eee}.login{position:fixed;inset:0;z-index:10;background:#0008;display:grid;place-items:center}.login.hidden{display:none}.login div{background:#fff;padding:30px;border-radius:10px;text-align:center}.login input{padding:11px;width:260px;margin:15px 0}.app{height:100%;display:flex;flex-direction:column;background:#fff}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#f7f7f7;border-bottom:1px solid #ddd}.header h1{font-size:20px;margin:0;white-space:nowrap}.online{font-size:13px;flex:1}.users{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.user{display:flex;align-items:center;gap:4px;font-size:12px}.user button{padding:3px 6px;font-size:11px}.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.avatar{width:32px;height:32px;border-radius:50%;background:#999}.messages{flex:1;overflow:auto;padding:20px}.message{display:flex;gap:12px;margin-bottom:16px}.message .avatar{width:40px;height:40px;flex:none}.text{word-break:break-word}.name{font-weight:bold}.time{font-size:12px;color:#999;margin-top:4px}.input{display:flex;gap:8px;padding:14px 20px;border-top:1px solid #ddd}.input textarea{flex:1;resize:none;height:42px;padding:10px;border:1px solid #ccc;border-radius:5px;font:inherit}.call{display:none;position:fixed;right:18px;bottom:18px;width:370px;z-index:20;background:#fff;border:1px solid #bbb;border-radius:10px;padding:10px;box-shadow:0 4px 18px #0003}.call.show{display:block}.videos{display:flex;gap:8px}.videos video{width:calc(50% - 4px);height:125px;background:#111;border-radius:6px;object-fit:cover}.call-title{text-align:center;font-weight:bold;margin-bottom:8px}.call-buttons{display:flex;gap:6px;justify-content:center;margin-top:8px}.off{display:none!important}@media(max-width:700px){.header{align-items:flex-start;flex-wrap:wrap}.call{left:8px;right:8px;width:auto}.controls{width:100%}.videos video{height:110px}}
</style>
</head>
<body>
<div class="login" id="login"><div><h2>ログインしてください</h2><input id="loginName" placeholder="名前を入力"><br><button id="loginBtn">ログイン</button></div></div>
<div class="app">
<header class="header"><h1>チャットルーム</h1><div class="online"><div id="onlineText">🔴 オフライン</div><div class="users" id="users"></div></div><div class="controls"><span id="nameDisplay"></span><button id="micBtn">🎤OFF</button><button id="camBtn">📷OFF</button><button id="renameBtn">名前を変更</button><div class="avatar" id="avatar"></div></div></header>
<main class="messages" id="messages"><div id="loading">メッセージを読み込み中...</div></main>
<footer class="input"><textarea id="messageInput" placeholder="メッセージ入力"></textarea><button id="sendBtn">送信</button></footer>
</div>
<div class="call" id="callPanel"><div class="call-title">通話中: <span id="callName"></span></div><div class="videos"><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" autoplay playsinline></video></div><div class="call-buttons"><button id="muteBtn">ミュート</button><button id="videoBtn">カメラ開始</button><button id="hangupBtn">切断</button></div></div>
<script>
const SUPABASE_URL='https://bttpvmqzyocukemozajz.supabase.co';
const SUPABASE_KEY='sb_publishable_sk8Jur900Z7CIhNWJb9UuQ_uW8nm7vI';
const H={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`};
let username=localStorage.getItem('chat_username')||'',micOn=false,camOn=false,stream=null,pc=null,callTarget=null,queuedCandidates=[];
const $=id=>document.getElementById(id);
const rtcConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function jsonHeaders(){return {...H,'Content-Type':'application/json'}}
async function api(path,options={}){return fetch(SUPABASE_URL+path,{...options,headers:{...(options.headers||{}),...H}})}
async function updateOnline(){if(!username)return;try{await api(`/rest/v1/online_users?username=eq.${encodeURIComponent(username)}`,{method:'DELETE'});await api('/rest/v1/online_users',{method:'POST',headers:jsonHeaders(),body:JSON.stringify({username,mic_on:micOn,cam_on:camOn})});const r=await api('/rest/v1/online_users?select=username,mic_on,cam_on');const us=await r.json();$('onlineText').textContent=`🟢 ${us.length}人がオンライン`;$('users').replaceChildren(...us.map(u=>{const d=document.createElement('div');d.className='user';const n=document.createElement('span');n.textContent=`${u.username} ${u.mic_on?'🎤':'🔈'} ${u.cam_on?'📷':'📵'}`;d.append(n);if(u.username!==username){const b=document.createElement('button');b.textContent='通話';b.onclick=()=>startCall(u.username);d.append(b)}return d}))}catch(e){console.error('online error',e)}}
async function loadMessages(){try{const r=await api('/rest/v1/messages?order=timestamp.asc');if(!r.ok)return;const ms=await r.json();$('loading')?.remove();for(const m of ms)if(!$(`[data-id="${m.id}"]`))showMessage(m)}catch(e){console.error(e)}}
function showMessage(m){const d=document.createElement('div');d.className='message';d.dataset.id=m.id;const a=document.createElement('div');a.className='avatar';a.style.background=m.avatar_color||'#999';if(m.avatar_image)a.style.backgroundImage=`url(${m.avatar_image})`;const body=document.createElement('div');body.innerHTML=`<div class="name"></div><div class="text"></div><div class="time"></div>`;body.querySelector('.name').textContent=m.username;body.querySelector('.text').textContent=m.text||'';body.querySelector('.time').textContent=new Date(m.timestamp).toLocaleString();d.append(a,body);$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight}
async function sendMessage(){const text=$('messageInput').value.trim();if(!text)return;const r=await api('/rest/v1/messages',{method:'POST',headers:jsonHeaders(),body:JSON.stringify({username,text,avatar_color:localStorage.getItem('chat_avatarColor')||'#999',avatar_image:localStorage.getItem('chat_avatarImage')||null,media:[],timestamp:Date.now()})});if(!r.ok)alert('送信に失敗しました');else{$('messageInput').value='';loadMessages()}}
async function signal(data){const r=await api('/rest/v1/webrtc_signaling',{method:'POST',headers:jsonHeaders(),body:JSON.stringify(data)});if(!r.ok)console.error('signaling error',await r.text())}
function setupPeer(){pc.onicecandidate=e=>{if(e.candidate&&callTarget)signal({from_username:username,to_username:callTarget,type:'candidate',candidate:e.candidate.toJSON()})};pc.ontrack=e=>{if(e.streams[0])$('remoteVideo').srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))endCall(false)}}
async function getMedia(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:camOn});$('localVideo').srcObject=stream;$('localVideo').classList.toggle('off',!camOn);return true}catch(e){alert('マイクまたはカメラを許可してください。\n'+e.message);return false}}
async function createPeer(){pc=new RTCPeerConnection(rtcConfig);setupPeer();pc.addTransceiver('audio',{direction:'sendrecv'});pc.addTransceiver('video',{direction:'sendrecv'});if(stream)for(const t of stream.getTracks()){const s=pc.getSenders().find(x=>x.track&&x.track.kind===t.kind);if(s)await s.replaceTrack(t)};for(const c of queuedCandidates)await pc.addIceCandidate(c).catch(()=>{});queuedCandidates=[]}
async function startCall(target){if(pc){alert('すでに通話中です');return}callTarget=target;camOn=true;micOn=true;$('camBtn').textContent='📷ON';$('micBtn').textContent='🎤ON';if(!(await getMedia()))return;await createPeer();const offer=await pc.createOffer();await pc.setLocalDescription(offer);await signal({from_username:username,to_username:target,type:'offer',sdp:pc.localDescription.sdp});showCall(target)}
function showCall(n){$('callName').textContent=n;$('callPanel').classList.add('show');$('muteBtn').textContent=micOn?'ミュート':'ミュート解除';$('videoBtn').textContent=camOn?'カメラ停止':'カメラ開始'}
async function handleSignal(m){if(m.type==='offer'){if(pc)return;if(!confirm(`${m.from_username} から着信です。受けますか？`))return;callTarget=m.from_username;camOn=true;micOn=true;if(!(await getMedia()))return;await createPeer();await pc.setRemoteDescription({type:'offer',sdp:m.sdp});const a=await pc.createAnswer();await pc.setLocalDescription(a);await signal({from_username:username,to_username:callTarget,type:'answer',sdp:a.sdp});showCall(callTarget)}else if(m.type==='answer'&&pc){await pc.setRemoteDescription({type:'answer',sdp:m.sdp})}else if(m.type==='candidate'){if(pc?.remoteDescription)await pc.addIceCandidate(m.candidate).catch(()=>{});else queuedCandidates.push(m.candidate)}else if(m.type==='hangup')endCall(false)}
async function poll(){if(!username)return;try{const r=await api(`/rest/v1/webrtc_signaling?to_username=eq.${encodeURIComponent(username)}&order=created_at.asc`);if(!r.ok)return;for(const m of await r.json()){await handleSignal(m);await api(`/rest/v1/webrtc_signaling?id=eq.${m.id}`,{method:'DELETE'})}}catch(e){console.error('poll error',e)}}
async function endCall(send=true){if(send&&callTarget)await signal({from_username:username,to_username:callTarget,type:'hangup'});if(pc){pc.close();pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('localVideo').srcObject=null;$('remoteVideo').srcObject=null;$('callPanel').classList.remove('show');callTarget=null}
async function toggleMic(){micOn=!micOn;$('micBtn').textContent=micOn?'🎤ON':'🎤OFF';if(stream)stream.getAudioTracks().forEach(t=>t.enabled=micOn);$('muteBtn').textContent=micOn?'ミュート':'ミュート解除';updateOnline()}
async function toggleCam(){camOn=!camOn;$('camBtn').textContent=camOn?'📷ON':'📷OFF';if(!pc){$('videoBtn').textContent=camOn?'カメラ停止':'カメラ開始';updateOnline();return}if(camOn){try{const s=await navigator.mediaDevices.getUserMedia({video:true});const t=s.getVideoTracks()[0];if(!stream)stream=new MediaStream();stream.addTrack(t);const sender=pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(t);$('localVideo').srcObject=stream}catch(e){camOn=false;alert('カメラを許可してください')}}else{const t=stream?.getVideoTracks()[0];if(t)t.enabled=false}$('localVideo').classList.toggle('off',!camOn);$('videoBtn').textContent=camOn?'カメラ停止':'カメラ開始';updateOnline()}
function login(){const n=$('loginName').value.trim();if(!n)return alert('名前を入力してください');username=n;localStorage.setItem('chat_username',n);$('nameDisplay').textContent=n;$('login').classList.add('hidden');loadMessages();updateOnline()}
$('loginBtn').onclick=login;$('loginName').onkeydown=e=>{if(e.key==='Enter')login()};$('sendBtn').onclick=sendMessage;$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('micBtn').onclick=toggleMic;$('camBtn').onclick=toggleCam;$('muteBtn').onclick=toggleMic;$('videoBtn').onclick=toggleCam;$('hangupBtn').onclick=()=>endCall(true);$('renameBtn').onclick=()=>{const n=prompt('新しい名前',username)?.trim();if(n){username=n;localStorage.setItem('chat_username',n);$('nameDisplay').textContent=n;updateOnline()}};
if(username){$('nameDisplay').textContent=username;$('login').classList.add('hidden');loadMessages();updateOnline()}setInterval(loadMessages,3000);setInterval(updateOnline,5000);setInterval(poll,700);
window.addEventListener('beforeunload',()=>{if(username)navigator.sendBeacon(`${SUPABASE_URL}/rest/v1/online_users?username=eq.${encodeURIComponent(username)}`,new Blob([], {type:'application/json'}))});
</script></body></html>
